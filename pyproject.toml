[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rocket-critic"
dynamic = ["version"]
description = "Watch GitHub repos for pull requests and review them with Claude Code's /code-review"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
rocket-critic = "rocket_critic.cli:main"

[project.urls]
Homepage = "https://github.com/sgstreet/rocket-critic"
Issues = "https://github.com/sgstreet/rocket-critic/issues"

[tool.hatch.version]
# The single source of the version; the release workflow checks the tag against it.
path = "src/rocket_critic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rocket_critic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
