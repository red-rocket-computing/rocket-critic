[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rocket-critic"
version = "0.1.0"
description = "Watch GitHub repos for pull requests and review them with Claude Code's /code-review"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rocket-critic = "rocket_critic.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rocket_critic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
