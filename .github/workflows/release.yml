# Release rocket-critic. The version is defined once, as __version__ in
# src/rocket_critic/__init__.py; the tag is "v" + that version.
#
# Two ways to start a release:
#
#   - Run the workflow by hand (Actions → Release → Run workflow, or
#     `gh workflow run release.yml --ref main -f tag=v0.2.0`) with "tag" set to
#     a tag that doesn't exist yet. After the checks pass, the workflow creates
#     the tag on the selected commit and publishes the release. New tags are
#     only created from the default branch. Nothing has to be pushed except
#     the version bump, so this also works where tags can't be pushed.
#   - Push a tag yourself:
#       git tag -a v0.2.0 -m "rocket-critic 0.2.0" && git push origin v0.2.0
#
# Either way the tag must match __version__ (v0.2.0 for 0.2.0; v0.2.0-rc1 or
# v0.2.0rc1 for 0.2.0rc1, which become pre-releases), and the CI workflow's
# checks (tests on Python 3.11-3.13, lint, wheel smoke test) run first.
#
# Running by hand with "tag" set to an existing tag checks out that tag, tests,
# builds and publishes it (use this to add the files to a release that has
# none). With "tag" empty, it checks, tests and builds the selected branch
# without publishing anything.
#
# If a release for the tag already exists (e.g. it was created on GitHub's
# "Draft a new release" page), the built files are attached to it and its title
# and notes are kept.
#
# Every release also carries rocket-critic.tar.gz, a copy of the source archive
# without the version in its name, so this link always installs the newest
# release (GitHub's "latest" skips drafts and pre-releases):
#   https://github.com/OWNER/REPO/releases/latest/download/rocket-critic.tar.gz
# A wheel can't have a version-less name: pip rejects it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0; created on this commit if it doesn't exist (empty: check, test and build only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check tag against version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      ref: ${{ steps.target.outputs.ref }}
      publish: ${{ steps.target.outputs.publish }}
      create_tag: ${{ steps.target.outputs.create_tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        name: Work out what to build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "No tag: checking, testing and building $SHA without publishing"
            exit 0
          fi
          if ! [[ "$tag" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Tag $tag must look like v1.2.3 or v1.2.3-rc1"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Building and publishing tag $tag"
          else
            if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::Tag $tag doesn't exist; new tags are only created from $DEFAULT_BRANCH (this run is on $REF)"
              exit 1
            fi
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag doesn't exist: building $SHA, then tagging it $tag and publishing"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - id: version
        name: Read the package version
        run: |
          version=$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/rocket_critic/__init__.py").read())[1])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
      - name: Tag must match the version
        if: steps.target.outputs.publish == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Accept v1.2.3 for 1.2.3, and v1.2.3-rc1 / v1.2.3rc1 for 1.2.3rc1.
          normalized=$(echo "${TAG#v}" | sed -E 's/-(a|b|rc|alpha|beta)\.?/\1/')
          if [ "$normalized" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match __version__ $VERSION in src/rocket_critic/__init__.py"
            exit 1
          fi

  ci:
    name: CI
    needs: check-version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check-version.outputs.ref }}

  build:
    name: Build distributions
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/rocket-critic --version
          /tmp/smoke/bin/rocket-critic -w /tmp/smoke/work init --repo owner/example
          grep -q 'name = "owner/example"' /tmp/smoke/work/config.toml
      - name: Add a version-less copy of the source archive
        # For releases/latest/download/rocket-critic.tar.gz; pip installs an
        # archive from a URL whatever it is called.
        run: cp dist/rocket_critic-*.tar.gz dist/rocket-critic.tar.gz
      - name: Check the version-less archive installs and runs
        run: |
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/pip install dist/rocket-critic.tar.gz
          /tmp/smoke-sdist/bin/rocket-critic --version
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [check-version, build]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the tag if needed, then the release (or add the files to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
          CREATE_TAG: ${{ needs.check-version.outputs.create_tag }}
          SHA: ${{ needs.check-version.outputs.sha }}
        run: |
          prerelease=false
          case "$TAG" in *-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease=true ;; esac

          if [ "$CREATE_TAG" = true ]; then
            # Fails if the tag appeared since the check, rather than moving it.
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" --silent
            echo "Created tag $TAG on $SHA"
          fi

          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "Release $TAG already exists; attaching the files and keeping its title and notes."
            gh release upload "$TAG" dist/* --clobber
            if [ "$prerelease" = true ]; then
              gh release edit "$TAG" --prerelease
            fi
            if [ "$draft" = true ]; then
              echo "::notice::Release $TAG is still a draft; publish it on GitHub when ready."
            fi
          else
            flags=()
            if [ "$prerelease" = true ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --title "rocket-critic $VERSION" \
              --generate-notes \
              --verify-tag \
              "${flags[@]}"
          fi
