# Release rocket-critic: push a tag matching the package version, e.g.
#
#   git tag -a v0.2.0 -m "rocket-critic 0.2.0" && git push origin v0.2.0
#
# The tag must equal "v" + __version__ in src/rocket_critic/__init__.py. Tags with
# a suffix (v0.2.0-rc1) become pre-releases. The checks are the CI workflow's
# (tests on Python 3.11-3.13, lint, wheel smoke test).
#
# If a release for the tag already exists (e.g. it was created on GitHub's
# "Draft a new release" page, which also creates the tag), the built files are
# attached to it and its title and notes are kept.
#
# Running the workflow by hand (Actions → Release → Run workflow):
#   - with "tag" set to an existing tag: check out that tag, test, build and
#     publish it (use this to add the files to a release that has none);
#   - with "tag" empty: check, test and build the selected branch without
#     publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0 (empty: check, test and build only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check tag against version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      ref: ${{ steps.target.outputs.ref }}
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - id: target
        name: Work out what to build
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [ -n "$tag" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Building and publishing tag $tag"
          else
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No tag: checking, testing and building $SHA without publishing"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - id: version
        name: Read the package version
        run: |
          version=$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/rocket_critic/__init__.py").read())[1])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
      - name: Tag must match the version
        if: steps.target.outputs.publish == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Accept v1.2.3 for 1.2.3, and v1.2.3-rc1 / v1.2.3rc1 for 1.2.3rc1.
          normalized=$(echo "${TAG#v}" | sed -E 's/-(a|b|rc|alpha|beta)\.?/\1/')
          if [ "$normalized" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match __version__ $VERSION in src/rocket_critic/__init__.py"
            exit 1
          fi

  ci:
    name: CI
    needs: check-version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check-version.outputs.ref }}

  build:
    name: Build distributions
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/rocket-critic --version
          /tmp/smoke/bin/rocket-critic -w /tmp/smoke/work init --repo owner/example
          grep -q 'name = "owner/example"' /tmp/smoke/work/config.toml
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [check-version, build]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release, or add the files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          prerelease=false
          case "$TAG" in *-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease=true ;; esac

          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "Release $TAG already exists; attaching the files and keeping its title and notes."
            gh release upload "$TAG" dist/* --clobber
            if [ "$prerelease" = true ]; then
              gh release edit "$TAG" --prerelease
            fi
            if [ "$draft" = true ]; then
              echo "::notice::Release $TAG is still a draft; publish it on GitHub when ready."
            fi
          else
            flags=()
            if [ "$prerelease" = true ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* \
              --title "rocket-critic $VERSION" \
              --generate-notes \
              --verify-tag \
              "${flags[@]}"
          fi
